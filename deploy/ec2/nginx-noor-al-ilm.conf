# NOOR AL-ILM reverse proxy. For HTTPS: point the domain's DNS A record at this server, replace
# "server_name _;" with your names, then run: sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/x-component;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Content-hashed build assets: cache for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8787;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
    }
}
